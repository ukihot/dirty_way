[package]
name = "dirty_way"
version = "0.1.0"
edition = "2024"

[dependencies]
# bevy_gilrs（ゲームパッド入力）は、依存する windows クレートのバージョンが
# wgpu-hal 側と衝突し Windows で実質ビルド不可になるため無効化。
# 本プロトタイプはマウス/キーボード操作のみを対象とする。
bevy = { version = "0.19.0", default-features = false, features = [
    # default_app
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    # default_platform（bevy_gilrs を除く）
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "custom_cursor",
    "sysinfo_plugin",
    # 3D 描画
    "3d_bevy_render",
    "scene",
    # UI（HUD表示用）
    "ui_api",
    "ui_bevy_render",
    # オーディオ
    "bevy_audio",
    "vorbis",
] }
avian3d = "0.7.0"      # 3D物理演算（旧 bevy_xpbd）
rand = "0.8"            # 敵の出現角度・種類やブレの乱数