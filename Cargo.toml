[package]
name = "dirty_way"
version = "0.1.0"
edition = "2024"

# `cargo run --features dev` で有効化する開発反復用の高速リンク。
# bevy_dylib経由でBevy本体を動的リンクにし、自分のコードだけを直した時の
# 再リンク時間を大幅に短縮する（Bevy公式のQuick Startで案内されている定番設定）。
# 通常の `cargo run`/`cargo build`（実機ベンチマーク時など）には影響しない。
[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
# bevy_gilrs（ゲームパッド入力）は、依存する windows クレートのバージョンが
# wgpu-hal 側と衝突し Windows で実質ビルド不可になるため無効化。
# 本プロトタイプはマウス/キーボード操作のみを対象とする。
bevy = { version = "0.19.0", default-features = false, features = [
    # default_app
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    # default_platform（bevy_gilrs を除く）
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "custom_cursor",
    "sysinfo_plugin",
    # 2D 描画
    "2d_bevy_render",
    "scene",
    # UI（HUD表示用）
    "ui_api",
    "ui_bevy_render",
    # オーディオ
    "bevy_audio",
    "vorbis",
] }
avian2d = "0.7.0"      # 2D物理演算（旧 bevy_xpbd）
rand = "0.10"            # 敵の出現角度・種類やブレの乱数
# SaveData（state.rs）のシリアライズに使う。bevy_gutzgutzのsave/input
# featureはserdeを内部で使うが、dirty_way自身の`#[derive(Serialize,
# Deserialize)]`のためにも直接の依存として持つ必要がある。
serde = { version = "1", features = ["derive"] }

# 自社ゲーム開発共通基盤（bevy_gutzgutz/README.md）。interactionはdirty_way
# にまだ対応する使い道がないため有効化しない（2作目で同じものが必要に
# なってから）。atlasはbuild.rsが生成するassets/generated/atlas/を
# GutzAtlasPluginが読む（ランタイム側）。atlas-sprite2dは敵の歩行アニメ
# （enemy.rs）、cameraはアリーナを画面に収めるカメラ設定（scene.rs）、
# pacingは敵の出現間隔のランプ機構（enemy.rs）をそれぞれgutzgutzへ委譲した
# ことで有効化（2026-07-30、複数ジャンルのゲームで再利用する前提での
# 意図的な先行抽出。doc/gutzgutz-requirements.md参照）。
bevy_gutzgutz = { path = "bevy_gutzgutz", features = [
    "devtools",
    "lifecycle",
    "input",
    "ui",
    "save",
    "steam",
    "atlas",
    "atlas-sprite2d",
    "camera",
    "pacing",
] }

[build-dependencies]
# build.rsからassets/character/のアトラス生成（atlas_build::pack）を呼ぶ
# ためだけの依存。atlas-buildはBevy本体をコード上importしない
# （bevy_gutzgutz/README.md参照）。
bevy_gutzgutz = { path = "bevy_gutzgutz", default-features = false, features = ["atlas-build"] }

# Bevy公式が推奨するdevプロファイル調整。opt-level=0（デフォルト）のままだと
# Bevy/wgpu/avianが最適化なしで動くため、コンパイルだけでなく実行時speed
# （FPS計測含む）も不必要に遅くなる。依存クレート側は一度opt-level=3で
# ビルドされればキャッシュされ、以後は自分のクレートだけの再ビルドで済む。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3