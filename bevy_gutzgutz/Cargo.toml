[package]
name = "bevy_gutzgutz"
version = "0.1.0"
edition = "2024"

# 各機能を Cargo feature で opt-in する（doc/gutzgutz-requirements.md 4節）。
# ゲーム側は使うプラグインの feature だけ有効化し、リリースビルドでは
# devtools 等を依存グラフごと落とせるようにする（同5.3節）。
[features]
default = []
devtools = ["dep:bevy_egui", "dep:avian3d", "bevy/bevy_render", "bevy/bevy_window"]
interaction = ["dep:avian3d", "bevy/bevy_camera", "bevy/bevy_window"]
input = []
ui = []
save = []
audio = []
camera = []
steam = []

[dependencies]
# dirty_wayのCargo.tomlと同じ0.19.0系に固定。default-features=falseとし、
# 必要なサブfeatureは各gutzgutz featureから `bevy/xxx` で個別に有効化する
# （bevy_gilrsを巻き込まないため。doc/bevy019_avian3d07_api.mdの7節参照）。
bevy = { version = "0.19.0", default-features = false }
# devtools（Physics Debugトグル）とinteraction（raycast/grab/explosion/impulse）
# の両方から使う共有依存。dirty_wayと同じ0.7.0系。
avian3d = { version = "0.7.0", optional = true }
bevy_egui = { version = "0.41.1", optional = true }
